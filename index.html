<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1a0e">
<meta name="description" content="Kaya: Lord of the Jungle. Fight five jungle bosses in your browser.">
<title>Kaya: Lord of the Jungle</title>
<link rel="icon" href="favicon.ico">
<!-- Rewarded ads (watch an ad to revive). After your AdSense account is approved for H5 games ads,
     uncomment these lines and put your publisher ID (ca-pub-...) in both places:
<script async data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-frequency-hint="30s" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<script>window.adsbygoogle = window.adsbygoogle || []; var adBreak = adConfig = function (o) { adsbygoogle.push(o); }; adConfig({ preloadAdBreaks: "on" });</script>

<style>
  html, body { margin: 0; height: 100%; background: #0b1a0e; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b1a0e; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font-family: system-ui, -apple-system, sans-serif; color: #f5deb0; background: radial-gradient(circle at 50% 40%, #1f3d22, #0b1a0e 70%); }
  #loader h1 { margin: 0; font-size: clamp(40px, 9vw, 96px); letter-spacing: 0.08em; color: #ffd15a; text-shadow: 0 4px 0 #5a3a10; }
  #loader p { margin: 0; font-size: clamp(14px, 3vw, 20px); opacity: 0.85; text-align: center; padding: 0 16px; }
  #bar { width: min(70vw, 420px); height: 14px; border-radius: 7px; background: #2b2414; overflow: hidden; border: 2px solid #6b4a1c; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #7fbf3f, #ffd15a); transition: width 0.2s; }
  #err { color: #ff8a7a; display: none; max-width: 80vw; text-align: center; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; text-align: center;
            background: #0b1a0e; color: #f5deb0; font: 20px system-ui, sans-serif; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { body.mobile #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="loader">
  <h1>KAYA</h1>
  <p>Lord of the Jungle</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="pct">Loading the jungle... 0%</p>
  <p id="err"></p>
</div>
<div id="rotate">Turn your phone sideways to play</div>
<script>
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  if (mobile) document.body.classList.add('mobile');
  var canvas = document.getElementById('game');
  var config = {
    arguments: [],
    dataUrl: "Build/KayaWeb.data.unityweb",
    frameworkUrl: "Build/KayaWeb.framework.js.unityweb",
    codeUrl: "Build/KayaWeb.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Dean Malhotra",
    productName: "Kaya: Lord of the Jungle",
    productVersion: "1.0.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 1.5) : Math.min(window.devicePixelRatio || 1, 2)
  };
  var s = document.createElement('script');
  s.src = "Build/KayaWeb.loader.js";
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      var n = Math.round(p * 100);
      document.getElementById('fill').style.width = n + '%';
      document.getElementById('pct').textContent = (n < 90 ? 'Loading the jungle... ' : 'Waking the beasts... ') + n + '%';
    }).then(function (inst) {
      window.kayaUnity = inst; // lets the ad system send results back to the game
      document.getElementById('loader').style.display = 'none';
    }).catch(function (e) {
      var el = document.getElementById('err'); el.style.display = 'block';
      el.textContent = 'Sorry, the game could not start on this browser: ' + e;
    });
  };
  s.onerror = function () { var el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Could not load the game files. Check your connection and reload.'; };
  document.body.appendChild(s);
</script>
</body>
</html>
